<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Мой Todo List</title>
    </head>
    <body>
        <h1>Мой Todo List</h1>
        <div class="input-group">
            <label for="todoInput">Новая задача</label>
            <input type="text" id="todoInput" placeholder="новая задача...">
            <button id="addBtn">Добавить</button>
        </div>
        <ul class="todoList">
            <!--задачи будут тут-->
        </ul>
        <div class="stats">
            <span class="totalCount">Всего: 0</span>
            <span class="completedCount">Выполнено: 0</span>
            <span class="remainingCount">Осталось: 0</span>
        </div>

        <script src="app.js"></script>
    </body>
</html>
